info:
  name: Detail User
  type: http
  seq: 2

http:
  method: GET
  url: "{{BaseURL}}/v1/admin/users/:user_id"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: user_id
      value: "{{user_id}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
