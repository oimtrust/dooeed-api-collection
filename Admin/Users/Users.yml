info:
  name: Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseURL}}/v1/admin/users"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
