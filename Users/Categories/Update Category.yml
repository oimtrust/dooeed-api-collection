info:
  name: Update Category
  type: http
  seq: 3

http:
  method: put
  url: "{{BaseURL}}/v1/categories/:category_id"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer{{token}}
  params:
    - name: category_id
      value: 01a0e92e-d783-7355-8938-659a3a032f87
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Contoh Kategori",
        "icon": "motorbike",
        "parent_id": "",
        "type": "income"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
