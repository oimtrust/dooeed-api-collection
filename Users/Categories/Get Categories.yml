info:
  name: Get Categories
  type: http
  seq: 2

http:
  method: get
  url: http://dooeed.test/api/v1/categories?type=expense
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer{{token}}
  params:
    - name: type
      value: expense
      type: query
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
