info:
  name: Get Import Options
  type: http
  seq: 8

http:
  method: GET
  url: "{{BaseURL}}/v1/debts/import-options"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer{{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
