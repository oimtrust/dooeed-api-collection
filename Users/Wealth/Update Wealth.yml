info:
  name: Update Wealth
  type: http
  seq: 3

http:
  method: PUT
  url: "{{BaseURL}}/v1/initial-wealth-entries/:id_wealth"
  headers:
    - name: Authorization
      value: Bearer  {{token}}
  params:
    - name: id_wealth
      value: 01a0d3d8-7e0a-7179-bc4d-41c7afacd872
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Blu By BCA",
        "amount": "4000000",
        "category": "cash", //cash, debt, non_current_asset, cash_equivalent, receivable
        "debt_type": null // null, credit_card_paylater, other
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
