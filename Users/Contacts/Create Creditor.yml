info:
  name: Create Creditor
  type: http
  seq: 2

http:
  method: post
  url: "{{BaseURL}}/v1/contacts"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer{{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "BTN Property",
        "type": "company" //person
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
