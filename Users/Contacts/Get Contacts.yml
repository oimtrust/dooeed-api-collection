info:
  name: Get Contacts
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseURL}}/v1/contacts?search=&per_page=100"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer{{token}}
  params:
    - name: search
      value: ""
      type: query
    - name: per_page
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
