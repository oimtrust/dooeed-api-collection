info:
  name: Get Capacity Profile
  type: http
  seq: 2

http:
  method: GET
  url: "{{BaseURL}}/v1/savings-capacity-profile"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: en-US,en;q=0.9
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
