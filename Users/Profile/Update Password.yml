info:
  name: Update Password
  type: http
  seq: 1

http:
  method: PUT
  url: "{{BaseURL}}/v1/profile/password"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: en-US,en;q=0.9
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "current_password": "Password2",
        "password": "Rahasia123!",
        "password_confirmation": "Rahasia123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
