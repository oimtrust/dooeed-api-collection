info:
  name: Preferences
  type: http
  seq: 3

http:
  method: put
  url: "{{BaseURL}}/v1/profile/preferences"
  headers:
    - name: Accept-Language
      value: en-US,en;q=0.9
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "preferred_locale": "id",
        "preferred_currency": "IDR"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
