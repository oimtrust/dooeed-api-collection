info:
  name: Delete Transaction
  type: http
  seq: 12

http:
  method: DELETE
  url: "{{BaseURL}}/v1/transactions/{{transaction_id}}"
  headers:
    - name: Authorization
      value: Bearer{{token}}
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
