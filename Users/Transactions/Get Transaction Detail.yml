info:
  name: Get Transaction Detail
  type: http
  seq: 9

http:
  method: get
  url: "{{BaseURL}}/v1/transactions/{{transaction_id}}"
  headers:
    - name: Authorization
      value: Bearer{{token}}
  auth: inherit

runtime:
  variables:
    - name: transaction_id
      value: 01a0fd15-c927-736c-adda-b97ab1cb2b50

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
