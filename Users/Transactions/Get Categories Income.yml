info:
  name: Get Categories Income
  type: http
  seq: 3

http:
  method: GET
  url: "{{BaseURL}}/v1/transactions/categories?type=income"
  headers:
    - name: Authorization
      value: Bearer{{token}}
  params:
    - name: type
      value: income
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
