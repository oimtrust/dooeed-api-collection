info:
  name: Get Categories Expense
  type: http
  seq: 2

http:
  method: GET
  url: "{{BaseURL}}/v1/transactions/categories?type=expense"
  headers:
    - name: Authorization
      value: Bearer{{token}}
  params:
    - name: type
      value: expense
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
