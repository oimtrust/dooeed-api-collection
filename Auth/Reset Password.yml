info:
  name: Reset Password
  type: http
  seq: 6

http:
  method: post
  url: http://dooeed.test/api/v1/auth/reset-password
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "{{reset_token}}",
        "email": "oim@example.com",
        "password": "passwordBaru123",
        "password_confirmation": "passwordBaru123"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
