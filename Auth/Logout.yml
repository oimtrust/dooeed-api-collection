info:
  name: Logout
  type: http
  seq: 6

http:
  method: post
  url: http://dooeed.test/api/v1/auth/logout
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("token", "");
          bru.setEnvVar("user_id", "");
          bru.setEnvVar("user_name", "");
          bru.setEnvVar("user_email", "");
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
